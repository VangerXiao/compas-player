# R3II 2025 packaging notes
#
# Reference values for building a multi-boot image. Nothing here is executed;
# it documents what the scripts assume.

[device]
name        = HiBy R3II 2025
board       = r3ii_2025
soc         = Ingenic X1600E
nand        = 128 MiB SPI NAND
screen      = 320x480
input       = wheel (KEY_LEFT / KEY_RIGHT), PLAYPAUSE, NEXTSONG

[kernel]
# stock v1.3 kernel; the SonixOS package for this device ships the same bytes
stock_md5   = 5612f37f29f5ac1a05680ce8be22d067
# CompasOS ships its own build; it boots the stock system fine as well
compas_md5  = 202af392d6d8574c4a980f15239f8ef3
vermagic    = 4.4.94+ preempt mod_unload MIPS32_R2 32BIT

[partitions]
# read from the device: /proc/mtd
0 = uboot      0x000000  0x080000
1 = kernel     0x080000  0x500000
2 = rootfs     0x580000  0x2d00000
3 = kernel2    0x3280000 0x500000
4 = rootfs2    0x3780000 0x1800000
5 = ota        0x4f80000 0x80000
6 = userdata   0x5000000 (UBI, remainder)

[targets]
stock   = boot the internal system
compas  = card compas/rootfs.squashfs, data on the internal UBI
sonix   = card sonix/rootfs.squashfs, data on the card (sonix/data)

[menu]
source   = bootmenu.c        # 320x480, wheel navigates, PLAYPAUSE confirms
renderer = gen_bootmenu.py   # writes bootmenu_0..2.raw and count_1..10.raw

[notes]
# This kernel refuses a second mount of the same exFAT device, so the hook moves
# its own card mount to <data>/mnt/sd_0 instead of letting the player mount the
# card again.
two_mounts  = not allowed
# The stock updater does not touch the recovery pair, so it stays usable:
recovery    = mtd3 (kernel2) + mtd4 (rootfs2), reflashed by the vendor cloner or
              by writing the ota:kernel2 flag from the running system
