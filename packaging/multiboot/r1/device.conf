# R1 packaging notes
#
# Reference values for building a multi-boot image. Nothing here is executed;
# it documents what the scripts assume.

[device]
name        = HiBy R1
board       = r1
soc         = Ingenic X1600E
nand        = 128 MiB SPI NAND
screen      = 480x800

[kernel]
# stock v2.0 kernel shipped by HiBy
stock_md5   = c446c0a3...
# Sonix kernel, the one the multi-boot image ships: it carries zram, which both
# CompasOS and SonixOS need to stay smooth on 64 MiB of RAM
ship_md5    = b48580b0...
vermagic    = 4.4.94-sonix preempt mod_unload MIPS32_R2 32BIT

[partitions]
0 = uboot      0x000000  0x080000
1 = kernel     0x080000  0x500000
2 = rootfs     0x580000  0x2d00000
3 = kernel2    0x3280000 0x500000
4 = rootfs2    0x3780000 0x1800000
5 = ota        0x4f80000 0x80000
6 = userdata   0x5000000 (UBI, remainder)

[targets]
# names written into /boot_target.txt on the card
stock   = boot the internal system
compas  = card compas/rootfs.squashfs, data on the internal UBI
sonix   = card sonix/rootfs.squashfs, data on the card (sonix/data)
rockbox = official Rockbox launcher (usr/bin/bootloader.rb), card .rockbox

[menu]
source   = bootmenu.c        # 480x800, VOL+/VOL- navigate, any other key confirms
renderer = gen_bootmenu.py   # writes bootmenu_0..3.raw and count_1..10.raw

[extras]
S99shutdown_logo = draws etc/logo.jpeg on rcK so a shutdown shows the stock logo
